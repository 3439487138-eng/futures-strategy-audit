[build-system]
requires = ["setuptools==80.9.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "futures-strategy-audit"
version = "0.1.0"
description = "Auditable replications of selected futures strategies using official exchange data"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.3.3",
  "pandas==2.3.3",
]

[project.optional-dependencies]
test = ["pytest==8.4.2"]

[project.scripts]
futures-audit = "futures_audit.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

